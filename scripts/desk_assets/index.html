<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#120a1c">
<title>Publishing Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23120a1c'/%3E%3Ccircle cx='8' cy='8' r='3.5' fill='%23ff9a3c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/desk.css">
<div class="wrap">
  <header>
    <h1>Publishing desk</h1>
    <div class="toolbar">
      <button class="btn" id="sync">Sync</button>
      <button class="btn" id="preview">Preview</button>
      <button class="btn primary" id="publish">Publish</button>
    </div>
  </header>
  <div id="message" role="status"></div>

  <section>
    <h2>needs attention <span class="count" id="n-attention"></span></h2>
    <ul class="items" id="attention"><li class="empty">Checking…</li></ul>
  </section>
  <section>
    <h2>ready <span class="count" id="n-ready"></span></h2>
    <ul class="items" id="ready"><li class="empty">Checking…</li></ul>
  </section>
  <section>
    <h2>changed <span class="count" id="n-changed"></span></h2>
    <ul class="items" id="changed"><li class="empty">Checking…</li></ul>
  </section>

  <section>
    <h2>capture</h2>
    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="write" role="tab">Write</button>
      <button class="tab" data-tab="source" role="tab">Save a source</button>
      <button class="tab" data-tab="photos" role="tab">Add photos</button>
      <button class="tab" data-tab="project" role="tab">New project</button>
    </div>
    <form class="capture" data-panel="write">
      <label>Title<input name="title" required maxlength="160" autocomplete="off"></label>
      <button class="btn">Create</button>
    </form>
    <form class="capture" data-panel="source" hidden>
      <label>URL<input name="url" type="url" required placeholder="https://" autocomplete="off"></label>
      <label>Title<input name="title" maxlength="160" autocomplete="off"></label>
      <button class="btn">Save</button>
    </form>
    <form class="capture" data-panel="photos" hidden>
      <label>Photos<input name="files" type="file" accept="image/jpeg,image/png,image/webp" multiple required></label>
      <label>Title<input name="title" maxlength="160" autocomplete="off"></label>
      <label>Caption<textarea name="caption" rows="2"></textarea></label>
      <button class="btn">Add</button>
    </form>
    <form class="capture" data-panel="project" hidden>
      <label>Title<input name="title" required maxlength="160" autocomplete="off"></label>
      <label>URL<input name="url" type="url" placeholder="https://" autocomplete="off"></label>
      <button class="btn">Create</button>
    </form>
    <ul class="items" id="created"></ul>
  </section>

  <section>
    <h2>recent</h2>
    <dl class="facts" id="recent"></dl>
  </section>
</div>
<script src="/desk.js"></script>
